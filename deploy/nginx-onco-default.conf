# /etc/nginx/sites-available/onco.conf
#
# Дефолтный server-блок: отвечает на запросы, которые НЕ совпали с
# server_name других блоков — то есть на обращение по IP (135.106.175.66).
# dotcursor.ru продолжает обслуживаться своим блоком (nginx выбирает
# блок по заголовку Host, домен матчится точнее и уходит в проксирование).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/onco;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # статику отдаём с кэшем
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    access_log /var/log/nginx/onco-access.log;
    error_log  /var/log/nginx/onco-error.log;
}
