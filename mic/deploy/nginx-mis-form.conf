# Форма заявки в техподдержку МИС.
# Файлы обычно идут напрямую в Яндекс.Диск мимо этого сервера,
# но резервный канал (/api/upload-proxy) гонит их через nginx —
# поэтому здесь подняты лимит тела и таймауты.

server {
    listen 80;
    listen [::]:80;
    server_name zayavka.example.ru;   # ← подставить домен

    # certbot допишет сюда HTTPS-блок

    access_log /var/log/nginx/mis-form.access.log;
    error_log  /var/log/nginx/mis-form.error.log;

    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # не копим 100 МБ на диске nginx — отдаём потоком дальше
        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
