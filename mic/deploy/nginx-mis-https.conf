# Поддомен для формы и вебхука бота MAX.
# MAX шлёт события только по HTTPS с сертификатом доверенного центра,
# поэтому боевой бот без этого блока не заработает.
#
# 1) A-запись zayavka.dotcursor.ru → 135.106.175.66
# 2) cp этот файл в /etc/nginx/sites-available/, симлинк в sites-enabled/
# 3) certbot --nginx -d zayavka.dotcursor.ru  (HTTPS-блок допишет сам)

server {
    listen 80;
    listen [::]:80;
    server_name zayavka.dotcursor.ru;

    access_log /var/log/nginx/mis-https.access.log;
    error_log  /var/log/nginx/mis-https.error.log;

    client_max_body_size 110m;

    # Вебхук бота. Секрет в пути — чужой POST бот отбросит.
    location /max-hook/ {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Веб-форма заявки
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
